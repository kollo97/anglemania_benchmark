# or manually:
#   Rscript -e "
#     ss <- read.delim('/local/Projects/AAkalin_Neuroblastoma/Results/simulate_single_cell/samplesheet_facScale0.1.tsv')
#     sub <- ss[ss\$nbatch == 4 & ss\$ngroup == 4, ]
#     write.table(sub, '/local/Projects/AAkalin_Neuroblastoma/Results/simulate_single_cell/samplesheet_btvr_sanity_check.tsv',
