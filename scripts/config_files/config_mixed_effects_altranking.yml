# Counterfactual run: the alternative gene-pair ranking criteria from
# docs/ANGLEMANIA_RANKING_CRITERION_ANALYSIS.md §6, measured on integration
# quality rather than on gene-set overlap.
#
#   anglmod1     |mean_zscore| / (sd_zscore + 1.0)
#   anglmod05    |mean_zscore| / (sd_zscore + 0.5)
#   anglsiggene  BH gate on |mean_zscore| across the pair universe, then
#                per-gene aggregation by significant-pair count
#
# Rationale: that document shows sd_zscore (rank weight 0.6) carries no
# ground-truth signal and points the wrong way (genuinely significant pairs
# have *higher* cross-batch sd than noise, while the ranking prefers lower),
# and that the fixed 0.5 prefilter admits ~28% of all possible pairs -- the
# rate pure noise dictates. These three variants replace the 0.4/0.6 rank
# blend without touching how the z-scores themselves are computed.
#
# Like config_mixed_effects_meanonly.yml, these gene lists are NOT produced by
# prepare_inputs.py -- no rule in rules/preprocess.smk matches these
# gene_selection values. scripts/R/make_alt_ranking_gene_lists.R writes them
# straight into preprocessed/ (a pure re-sort of the existing
# anglemania_stats/ pair tables), so Snakemake treats them as pre-existing
# inputs and only the integrate -> metrics -> combine chain runs. Run that
# script first.
#
# Scope: baseline + the 4 LOBO samples, matching the meanonly run so the two
# are directly comparable. `name` differs from both existing configs so the
# combine rule writes its own combined-metrics file; compare all of them with
# scripts/R/compare_alt_ranking_metrics.R.
name: mixed_effects_altranking_lobo

samplesheet: "/local/Projects/AAkalin_Neuroblastoma/Results/simulate_single_cell/h5ad/mixed_effects/samplesheet_altranking_lobo.tsv"
output_dir: "/local/Projects/AAkalin_Neuroblastoma/Results/simulate_single_cell/h5ad/mixed_effects/pipeline_output/"
out_preprocessed: "preprocessed/"
out_integration: "integration/"
out_metrics: "metrics/"
out_embedding: "embedding/"

batch_key: "Batch"
label_key: "Group"
anglemania_mode: "cosine"
permutation_function: "sample"
normalization_mode: "classical"
n_genes: 2000

integration_methods: ["scanorama", "scvi"]
gene_selection: ["anglmod1", "anglmod05", "anglsiggene"]
gpu: False
