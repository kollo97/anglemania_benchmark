# Gene-selection environment (rules preprocess_cpu / preprocess_gpu).
#
# Copied from ~/projects/pyanglemania/envs/pyanglemania.yml, with pyanglemania
# itself added: the upstream file is a *development* env spec and assumes you
# pip-install the package into it by hand, which is fine interactively but not
# when Snakemake builds the env from this file.
#
# Snakemake materializes this under scripts/.snakemake/conda/ when run with
# --sdm conda. Keep it in sync with upstream:
#   diff envs/pyanglemania.yml ~/projects/pyanglemania/envs/pyanglemania.yml
#
# Changing this file changes the env hash, so Snakemake rebuilds the ~11 GB env
# and marks every preprocess output stale.
name: pyanglemania
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - scanpy
  - scikit-misc
  - click
  - python-igraph
  - leidenalg
  - scvi-tools
  - harmonypy
  - anndata
  - pytest
  - ruff
  - hatchling
  - ipykernel
  - nbconvert
  - cuda-cudart-dev=12.9
  - pip:
      - cupy-cuda12x
      # Released package from PyPI. Unpinned, so a rebuilt env can pick up a
      # newer pyanglemania than the one a previous run used -- pin it
      # ("pyanglemania==0.1.0") before any run whose gene lists have to be
      # reproducible. Note this is the *released* version: local edits in
      # ~/projects/pyanglemania no longer reach the pipeline. To benchmark
      # unreleased work, swap in "-e /home/akollot/projects/pyanglemania".
      - pyanglemania
